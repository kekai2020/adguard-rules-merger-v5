name: Merge Rules (V5)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'merger/**'
      - 'tests/**'
      - 'merge_rules.py'
      - 'config_loader.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m pytest tests/ -q --tb=short

  merge:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config
        run: python merge_rules.py validate config/sources.yaml

      - name: Restore rule cache
        uses: actions/cache@v5
        with:
          path: cache/
          key: rule-cache-v5-${{ github.run_id }}
          restore-keys: |
            rule-cache-v5-

      - name: Run merge
        run: |
          echo "::group::Merge Output"
          python merge_rules.py merge --config config/sources.yaml
          echo "::endgroup::"

      - name: Save rule cache
        uses: actions/cache@v5
        with:
          path: cache/
          key: rule-cache-v5-${{ github.run_id }}

      - name: Verify output
        run: |
          echo "Output files:"
          ls -la output/ 2>/dev/null || echo "ERROR: output/ directory missing!"
          test -f output/merged_rules.txt || (echo "ERROR: merged_rules.txt not found" && exit 1)
          echo "merged_rules.txt lines: $(wc -l < output/merged_rules.txt)"

      - name: Debug git state
        run: |
          echo "=== git status ==="
          git status
          echo "=== output/ exists? ==="
          ls -la output/ | head -20
          echo "=== output/ tracked by git? ==="
          git ls-files output/ | head -5
          echo "=== .gitignore check ==="
          git check-ignore -v output/merged_rules.txt || echo "not ignored (or not tracked)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Clear any stale tracked state then force-add output/ (it's in .gitignore
          # for local dev, but CI must commit the generated rules).
          git rm -r --cached output/ 2>/dev/null || true
          git add -f output/
          echo "=== staged changes ==="
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No changes detected — skipping commit"
          else
            git commit -m "Auto-merge V5: update rules $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "=== pushing ==="
            git push origin main
            echo "Push successful"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: merged-rules-v5
          path: output/
          retention-days: 30
